name: ci

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked
      # GH #59: the shipped type-DB fixtures are the checker's source of
      # truth. This rides the run above but is named so a corrupt or
      # truncated harvest shows up as its own failing check rather than one
      # line inside the suite. Offline — no DB is ever fetched in CI.
      - name: Type-DB fixture shape guard
        run: cargo test --locked --lib typedb_shape_guard
      - name: Release build (smoke)
        run: cargo build --release --locked

  npm-pack-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate npm package manifests
        run: |
          set -euo pipefail
          for pkg in npm/*/package.json; do
            echo "check $pkg"
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$pkg"
          done
          node -e "require('./npm/openplanet-lsp/lib/platform.js'); console.log('platform map ok')"
          # Meta package should pack without the native binary present.
          (cd npm && npm pack ./openplanet-lsp --dry-run)

# Self-update checks are intentional opt-in:
#   - Local pack smoke:   ./scripts/release/smoke-self-update.sh
#   - Registry multi-PM:  ./scripts/release/smoke-self-update-registry.sh
#                         or Actions → "self-update-matrix" (also runs post-tag release)
