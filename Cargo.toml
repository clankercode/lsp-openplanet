[package]
name = "openplanet-lsp"
version = "0.2.8"
edition = "2021"
description = "Language Server Protocol implementation for OpenPlanet AngelScript"
license = "MIT"
repository = "https://github.com/clankercode/lsp-openplanet"
homepage = "https://github.com/clankercode/lsp-openplanet"
readme = "README.md"
authors = ["Max Kaye <m@xk.io>"]
keywords = ["lsp", "language-server", "angelscript", "openplanet", "trackmania"]
categories = ["development-tools", "parser-implementations"]
exclude = [
  ".worktrees/",
  ".backlog/",
  "tests/fixtures/",
  "npm/",
  "scripts/",
  "docs/",
  "served-html/",
  ".github/",
  "todo-*.txt",
  "package.json",
  "package-lock.json",
]

[dependencies]
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
zip = "2"
dashmap = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
insta = { version = "1", features = ["glob"] }
